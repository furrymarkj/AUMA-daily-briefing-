name: Daily briefing

# Runs the pipeline every morning and publishes the edition to GitHub Pages.
# Schedule is UTC: 11:00 UTC is about 6:00 AM CDT / 5:00 AM CST in
# America/Chicago (daylight saving shifts it by an hour twice a year).
# Use "Run workflow" in the Actions tab to trigger a run on demand.
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the daily briefing
        run: python3 run.py

      # Two commit steps, split by outcome (round 2, N1). A failed run
      # must never publish partial output: on failure only the state
      # database is committed (diagnostics — source_runs, the failed
      # edition receipt). docs/ is committed only when the pipeline
      # succeeded, so a failed run cannot push a half-written edition
      # to GitHub Pages. The publish step itself also stages files
      # before promoting them (see publish.py).
      - name: Commit diagnostics only (failed runs)
        if: failure()
        run: |
          git config user.name "auma-briefing-bot"
          git config user.email "auma-briefing-bot@users.noreply.github.com"
          git add state
          # Commit only when something changed (a no-op rerun commits nothing).
          git diff --cached --quiet || git commit -m "Daily briefing $(TZ=America/Chicago date +%Y-%m-%d) (failed run diagnostics)"
          # A concurrent remote commit rejects a plain push. Fetch and
          # rebase once, then push again; never force-push.
          git push || (git pull --rebase && git push)

      - name: Commit edition and state
        if: success()
        run: |
          git config user.name "auma-briefing-bot"
          git config user.email "auma-briefing-bot@users.noreply.github.com"
          git add docs state
          # Commit only when something changed (a no-op rerun commits nothing).
          git diff --cached --quiet || git commit -m "Daily briefing $(TZ=America/Chicago date +%Y-%m-%d)"
          # A concurrent remote commit rejects a plain push. Fetch and
          # rebase once, then push again; never force-push.
          git push || (git pull --rebase && git push)
